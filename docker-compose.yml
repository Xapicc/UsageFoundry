services:
  usagefoundry:
    build:
      context: .
      args:
        # Which winnow the image bundles. Build arguments rather than
        # environment: they are consumed by the Dockerfile and nothing in the
        # container reads them, so putting them under `environment:` would be a
        # variable every child carries and nothing consumes.
        #
        # Both default in the Dockerfile, so `docker compose up --build` is
        # unchanged for anyone who sets neither. `WINNOW_REF=` (empty) builds
        # without winnow, and context pruning then reports itself unavailable
        # instead of quietly pruning nothing — which is the escape hatch for a
        # build host that cannot reach GitHub, and the reason this is reachable
        # from `.env` at all rather than only by editing the Dockerfile.
        WINNOW_REPO: "${WINNOW_REPO:-https://github.com/Xapicc/winnow.git}"
        WINNOW_REF: "${WINNOW_REF-0421da53d5087c1746c3101d0c97d0682d3094ac}"
    # All three default to today's values, so `docker compose up` is unchanged.
    # Overriding them lets a second instance run alongside the first — to
    # compare two branches against the same transcripts, for example. Pair them
    # with `docker compose -p <project>`, which namespaces the data volume so
    # the two instances do not share a SQLite database:
    #
    #   UF_PORT=3100 UF_CONTAINER_NAME=usagefoundry-x UF_IMAGE_TAG=x \
    #     docker compose -p usagefoundry-x up -d --build
    #
    # A distinct UF_IMAGE_TAG matters: sharing one tag means each build moves it
    # under the other instance's feet.
    #
    # This is not a scaling mechanism, and `docker compose -p` is what makes the
    # difference: it gives the second instance its own data volume. Two
    # containers sharing one data directory is not supported and is refused —
    # only one process may write, because the claim that keeps two agents out of
    # one folder is atomic by virtue of a single event loop rather than by
    # anything SQLite enforces. The second gets a read-only server. See README.
    image: usagefoundry:${UF_IMAGE_TAG:-latest}
    container_name: ${UF_CONTAINER_NAME:-usagefoundry}

    # The *server* runs as root and every child it spawns — the work cycle, the
    # reviewer, the chat, an orchestrator block's turn, and the git this app runs
    # itself — is dropped to UF_AGENT_UID:UF_AGENT_GID below, which is still your
    # own uid. Nothing about your files changes: the processes that touch the
    # bind mounts are the same uid they always were.
    #
    # What changes is that they are no longer the *server's* uid, which is what
    # makes three of this app's defences mean anything. `/proc/<server>/environ`
    # is mode 0400 owned by the server, so `childEnv` stripping UF_AUTH_TOKEN,
    # ANTHROPIC_ADMIN_KEY and UF_GITHUB_TOKEN from an agent's environment is now
    # enforced rather than advised; /data is root-owned 0700, so an agent cannot
    # rewrite a budget, a status or a permission mode straight in the database;
    # and the MCP capability file's 0600 excludes something. Shared, all three
    # were decorative — one `tr '\0' '\n' < /proc/7/environ` handed back every
    # secret the container holds. See docs/security.md for what it still does
    # *not* buy.
    #
    # Root here is the supervisor, not the agents: it is one process, running
    # code from this repository, against twenty-five unattended children whose
    # prompts come out of repositories nobody here reviewed. It has to be this
    # way round — the child must own the workspace, because an isolated run is
    # ordered to commit into your own .git, and the server must be able to read
    # ~/.claude/.credentials.json, which the CLI keeps 0600 owned by that same
    # uid. Both cannot be it.
    user: "0:0"

    # Bound to loopback by default on purpose. This container holds Claude
    # credentials and can run an agent with write access to mounted code —
    # publishing it on 0.0.0.0 hands both to anyone who can reach the port.
    #
    # UF_BIND_ADDRESS moves it, and the two settings it has to move *with* are
    # in .env beside it: UF_AUTH_TOKEN must be set (UF_ALLOW_NO_AUTH is only
    # ever right for loopback), and UF_COOKIE_SECURE must not be 1 unless there
    # is TLS in front — a browser never returns a Secure cookie over plain HTTP,
    # so signing in appears to work and every request after it is anonymous.
    # Nothing here can check either: compose publishes what it is told.
    ports:
      - "${UF_BIND_ADDRESS:-127.0.0.1}:${UF_PORT:-3000}:3000"

    environment:
      # Set to a long random string to require a token in the UI. Leaving it
      # empty makes the container refuse to start unless UF_ALLOW_NO_AUTH below
      # is set to 1 — an empty token means every route here, including the one
      # that starts billed agents against your repositories, is open to whoever
      # can reach the port, and that had been the shipped default with nothing
      # anywhere reporting it.
      UF_AUTH_TOKEN: "${UF_AUTH_TOKEN:-}"
      # The explicit "yes, run with no authentication" switch. Only ever right
      # for a loopback-bound install on a machine you alone use. Passed through
      # rather than defaulted here on purpose: a default would put the choice
      # back in this file, where nobody rereads it.
      UF_ALLOW_NO_AUTH: "${UF_ALLOW_NO_AUTH:-}"
      # Optional: a read-only credential for /api/status, so a monitor can poll
      # queue depth and spend without holding the token above — which is the one
      # that can also start billed agents. Blank leaves that route behind the
      # ordinary gate rather than open.
      UF_STATUS_TOKEN: "${UF_STATUS_TOKEN:-}"
      # Forces the session cookie's Secure flag on ("1") or off ("0"). Blank
      # follows the request, which is right behind a terminator that sets
      # X-Forwarded-Proto and right on loopback HTTP.
      UF_COOKIE_SECURE: "${UF_COOKIE_SECURE:-}"
      # Optional: enables the API-account panel. Needs an org Admin key.
      ANTHROPIC_ADMIN_KEY: "${ANTHROPIC_ADMIN_KEY:-}"
      # Optional: what a run uses to push, open a PR, or read an issue. The
      # mounted ~/.claude carries Claude's login and nothing else — no
      # ~/.gitconfig, no ~/.ssh, no ~/.config/gh — so without this every
      # GitHub command a run tries fails, and fails inside a tool call.
      # Scope it to the repositories you actually run agents against: an
      # unattended agent can use everything this token can.
      UF_GITHUB_TOKEN: "${UF_GITHUB_TOKEN:-}"
      # Optional, and how the sentence above is followed past one or two
      # repositories: `folder=token` entries separated by "|". A run gets the
      # token its own repository is configured with and no other; a folder no
      # entry names falls back to the one above, so leaving that blank gives an
      # unnamed repository no credential at all.
      UF_GITHUB_TOKENS: "${UF_GITHUB_TOKENS:-}"
      # Optional: `gh` extensions to install at boot, space-separated, each
      # `owner/repo` or `owner/repo@tag` to pin a version. Read by
      # docker-entrypoint.sh and by nothing in the app — installing them is a
      # boot-time job, not a request-time one. They land in the named volume
      # below, so this list is consulted once per extension and not again.
      # Needs UF_GITHUB_TOKEN: gh refuses every API call unauthenticated, even
      # for a public repository.
      UF_GH_EXTENSIONS: "${UF_GH_EXTENSIONS:-}"
      # Optional: Python tools to install at boot, space- or "|"-separated, each
      # a PEP 508 requirement (`cozempic`, `cozempic==1.8.39`). Read by
      # docker-entrypoint.sh and by nothing in the app, the same arrangement
      # UF_GH_EXTENSIONS has. This is what makes a Claude Code plugin whose
      # hooks shell out to a Python command work: the image has no pip, and a
      # hook whose command is missing exits 0 having done nothing.
      UF_PY_TOOLS: "${UF_PY_TOOLS:-}"
      # Optional: winnow's intake filter. "1" makes docker-entrypoint.sh start a
      # loopback proxy inside this container and point every agent at it with
      # ANTHROPIC_BASE_URL, so a tool result a rule marks as spent is dropped
      # before the API ever writes it to the prompt cache. Blank is off and is
      # the shipped state.
      #
      # One variable rather than two on purpose: ANTHROPIC_BASE_URL is exported
      # by the entrypoint, not set here, so an operator cannot end up with the
      # URL pointed at a proxy that was never started — which fails every agent
      # request with a connection refused inside a tool call.
      #
      # Read by the entrypoint and by nothing in the app, the same arrangement
      # UF_GH_EXTENSIONS and UF_SANDBOX_ENFORCEMENT have.
      WINNOW_FILTER: "${WINNOW_FILTER:-}"
      # Where the winnow checkout is, as this container sees it. Only consulted
      # when the switch above is on. Defaulted to the conventional location
      # under the first workspace mount, so an operator who cloned it beside
      # their other projects sets nothing.
      # Blank lets the entrypoint choose: a workspace checkout if there is
      # one, else the winnow this image already vendors at /opt/winnow/src.
      WINNOW_FILTER_PATH: "${WINNOW_FILTER_PATH:-}"
      # Loopback port for the filter. Not 8787: the Discord relay binds that
      # inside this same container, and the second process to want a port gets
      # nothing rather than a degraded service.
      WINNOW_FILTER_PORT: "${WINNOW_FILTER_PORT:-8789}"
      # The CLI's own sandbox around the commands an agent runs. Blank is off
      # and is the shipped state: nothing is written, nothing is confined, and
      # this install behaves exactly as it did before the switch existed. "1"
      # makes docker-entrypoint.sh write /etc/claude-code/managed-settings.json
      # — root-owned, so it is the one policy surface a run cannot edit.
      #
      # Read by the entrypoint and by nothing in the app, the same arrangement
      # UF_GH_EXTENSIONS has: what the app reports is the *file*, read at boot,
      # so an install where the write failed says there is no sandbox rather
      # than repeating what this variable claims.
      #
      # It needs the seccomp profile from the security_opt block at the bottom
      # of this file — see there for where to put it. Without it bubblewrap
      # cannot create a namespace, and **UF_SANDBOX_ENFORCEMENT does not catch
      # that**: the CLI's availability check asks whether bwrap and socat exist
      # and are executable and never runs one, so nothing is "unavailable", the
      # gate below never fires at either setting, and every Bash call is wrapped
      # in a program that exits 1 before the command does. Measured here, over
      # fifteen hours and ten runs. The `sandbox` row on a run's log is what
      # names it; docs/install.md carries the check to run first.
      UF_SANDBOX: "${UF_SANDBOX:-}"
      # What a sandbox the CLI *knows* it cannot start does — i.e. a missing
      # bwrap or socat binary, which is the only unavailability it detects.
      # "refuse" (the default, and what blank means) exits the CLI non-zero
      # rather than running unconfined; "warn" runs the command anyway.
      # Refusing is loud and recoverable — the
      # run's own log names it — where the alternative is a fleet that works
      # perfectly and confines nothing.
      UF_SANDBOX_ENFORCEMENT: "${UF_SANDBOX_ENFORCEMENT:-}"
      # Domains sandboxed commands may reach, "|"-separated. Blank leaves egress
      # unrestricted, which is deliberate: an allowlist this project guessed at
      # would fail inside a tool call the first time an agent ran `npm install`.
      # Naming any domain also pins the list to the managed file, so a run
      # cannot widen it from the ~/.claude/settings.json it can write.
      UF_SANDBOX_ALLOWED_DOMAINS: "${UF_SANDBOX_ALLOWED_DOMAINS:-}"
      # The other half of that sandbox, and a separate switch on purpose. "1"
      # makes docker-entrypoint.sh give ~/.claude and its settings.json to root
      # at boot — that file is an honored source for `sandbox.*`, so until this
      # is on a run can append `{"sandbox":{"filesystem":{"allowWrite":["/"]}}}`
      # to it and every later session, its own and its siblings', starts
      # confined to nothing. Blank is off and is the shipped state; the
      # entrypoint acts on the literal "1" and says so on the boot log for any
      # other value.
      #
      # Forwarded here because it has to be. It is read by the entrypoint and by
      # nothing in the app, and this file has no env_file, so without this line
      # UF_LOCK_CLAUDE_HOME=1 in .env is read by compose for interpolation and
      # never reaches the container: a security control switched on in a file,
      # never applied, and indistinguishable from one that is off.
      UF_LOCK_CLAUDE_HOME: "${UF_LOCK_CLAUDE_HOME:-}"
      # One entry per selectable workspace, "Label=/container/path", separated
      # by "|". An entry whose label is empty — i.e. UF_WORKSPACE_N_NAME is not
      # set in .env — is skipped, so extra workspaces are switched on from .env
      # without editing this file.
      WORKSPACE_ROOTS: "${UF_WORKSPACE_NAME:-Workspace}=/workspace|${UF_WORKSPACE_2_NAME:-}=/workspace2|${UF_WORKSPACE_3_NAME:-}=/workspace3|${UF_WORKSPACE_4_NAME:-}=/workspace4"
      # Slots this file has no volume line for, named rather than ignored.
      #
      # The four above are a ceiling in YAML, not a cap in the code: compose
      # cannot add a volume conditionally, so a fifth slot cannot come from
      # .env. Left undetected it is a silent no-op — never mounted, never in
      # the picker, indistinguishable from a mounted directory that is empty —
      # which is the failure the `:?` markers below exist to refuse. These
      # names (values are deliberately not forwarded) make the app refuse to
      # start and say which variable it cannot honour.
      #
      # Slots 5-8 are what an operator following .env.example would reach for.
      # A deployment that really does mount more does it in a
      # docker-compose.override.yml, and sets this to "" there to say the mount
      # was actually made — see docs/install.md, "More than four workspaces".
      UF_UNMOUNTED_WORKSPACES: "${UF_WORKSPACE_5_NAME:+UF_WORKSPACE_5_NAME }${UF_WORKSPACE_6_NAME:+UF_WORKSPACE_6_NAME }${UF_WORKSPACE_7_NAME:+UF_WORKSPACE_7_NAME }${UF_WORKSPACE_8_NAME:+UF_WORKSPACE_8_NAME }"
      WORKSPACE_ROOT: /workspace
      # Optional: how many parsed transcript turns this process keeps in memory.
      # Blank takes the default, which is sized against V8's own default heap
      # limit. Past it the coldest files are re-read from disk on each scan, so
      # raising it trades memory for speed and lowering it the other way — the
      # figures on the dashboard are the same either way.
      UF_TRANSCRIPT_CACHE_MAX_ENTRIES: "${UF_TRANSCRIPT_CACHE_MAX_ENTRIES:-}"
      CLAUDE_HOME: /home/node/.claude
      CLAUDE_CONFIG_DIR: /home/node/.claude
      DATA_DIR: /data
      # The server's own heap ceiling, stated rather than inherited from the
      # machine. Left unset, V8 sizes its old space from the *host's* RAM —
      # around 2.2 GB on a small host and twice that on a 16 GB one — so the one
      # term of the memory arithmetic below that belongs to this process was a
      # property of wherever the container happened to land. 2048 MiB is roughly
      # what V8 was already choosing, so nothing here shrinks: the point is that
      # `mem_limit` can be derived from a number instead of guessed at.
      #
      # All four child environments strip NODE_OPTIONS, so this bounds the
      # server and not the `claude` children it spawns. An agent inheriting it
      # would abort a work cycle mid-flight on a figure chosen for something
      # else, and the run loop would file that as the agent crashing.
      NODE_OPTIONS: "--max-old-space-size=${UF_NODE_HEAP_MB:-2048}"
      # The uid every spawned child is dropped to — the same UF_UID/UF_GID the
      # `user:` line above used to carry, so an existing .env needs no edit and
      # the processes that write your files are the uid they always were. The
      # two names are separate because they now mean different things: UF_UID is
      # "the uid that owns my bind mounts", and this is "who the agents are",
      # which is the same answer for a reason (they have to write those mounts)
      # and not the same question.
      #
      # Clearing these switches the split off: everything runs as root, which is
      # strictly worse than the arrangement this replaced. Set them, or set
      # `user:` back to "${UF_UID:-1000}:${UF_GID:-1000}" and take the shared-uid
      # behaviour whole — the server refuses to boot if it is asked to drop a
      # child while holding no privilege to do it, rather than starting without
      # the boundary and saying nothing. A UF_UID of 0 is the one case that is
      # neither: there is no separable uid on such a host, so it runs as it did
      # before and the boot log says the boundary is absent.
      UF_AGENT_UID: "${UF_UID:-1000}"
      UF_AGENT_GID: "${UF_GID:-1000}"
      # The group the orchestrator chat and a workflow's orchestrator block run
      # in — the same uid as every other child, a different group. It owns the
      # per-turn MCP capability file (0710 on the directory, 0040 on the file),
      # which is what stops a concurrent work-cycle agent reading a live
      # capability off `/proc/<pid>/cmdline` and calling /api/mcp as the chat.
      #
      # The default is the group the image creates and must not be the gid the
      # agents run as: the server refuses to boot when the two match, rather
      # than handing the file to the group it is being kept from. Clearing this
      # keeps the uid split and drops this one boundary, which the boot log
      # states — it is not silent either way.
      UF_CHAT_GID: "${UF_CHAT_GID:-65533}"
      # Optional: where this container POSTs when a run reaches an ending that
      # needs a person — needs-review, a guard that stopped it, a crash, the
      # first rung of the 429 ladder. Blank is off and is the shipped state.
      #
      # One generic signed JSON body goes to one URL you name; nothing here
      # knows about any vendor. Discord's and Slack's incoming webhooks accept
      # only their own body shape, so neither can be pointed at directly — a
      # bare Discord URL answers 400. Home Assistant's
      # POST /api/webhook/<webhook_id> takes arbitrary JSON and is the shaping
      # layer that fans out to them. For Discord there is one in this image:
      # set DISCORD_WEBHOOK_URL below and point this at
      # http://127.0.0.1:8787/uf. See docs/install.md, "Being told".
      UF_WEBHOOK_URL: "${UF_WEBHOOK_URL:-}"
      # The HMAC key for X-UF-Signature: sha256=<hex>, over the exact body
      # bytes. Required alongside the URL rather than optional beside it —
      # nothing is delivered while this is empty, because a Home Assistant
      # webhook id is an unauthenticated URL and the signature is the only thing
      # that tells your automation this install's POST from anyone else's.
      UF_WEBHOOK_SECRET: "${UF_WEBHOOK_SECRET:-}"
      # Optional: "1" also notifies when a run simply finished. Blank is off and
      # is the shipped state, because at a fleet's scale a POST per success is
      # how a channel stops being read — and the endings above are the ones it
      # exists for. Worth turning on if you run a handful of runs a day and want
      # the "it is done" signal; it widens `completed` and nothing else.
      UF_NOTIFY_ON_SUCCESS: "${UF_NOTIFY_ON_SUCCESS:-}"
      # Optional: the Discord channel webhook that scripts/discord-relay.mjs
      # forwards to. Setting it is what starts the relay at boot; blank is off
      # and starts nothing. UF_WEBHOOK_URL above must then name the relay
      # (http://127.0.0.1:8787/uf) or nothing reaches it, which the boot log
      # says.
      #
      # The entrypoint hands this to the relay and then **unsets it** before the
      # server starts, so it is absent from the process that spawns agents.
      # orchestrator.ts builds an agent's environment as { ...process.env }, and
      # this URL posts to your channel on possession alone — a variable left
      # here would be one every unattended agent could read. Nothing else in
      # this file may forward it without answering that.
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      # Optional: whose mention the relay puts in the message, which is what
      # Discord turns into a push. Without it the notification sits in a channel
      # until somebody looks — the same silence the webhook exists to end.
      # Unset alongside the URL above.
      DISCORD_MENTION_USER_ID: "${DISCORD_MENTION_USER_ID:-}"
      # Optional: how this install is reached from wherever you read the
      # notification, e.g. https://uf.example.com. It is the only absolute URL
      # this app builds, and it exists for the `url` field of that body. Blank
      # sends an empty one.
      UF_PUBLIC_URL: "${UF_PUBLIC_URL:-}"
      # Optional: a name for this install, for an operator who runs more than
      # one. It is the `install` field of that body and nothing else reads it.
      UF_INSTALL_LABEL: "${UF_INSTALL_LABEL:-}"

    volumes:
      # Credentials + transcripts. Read-write because Claude Code writes new
      # session transcripts here as runs execute — mounting :ro breaks runs.
      #
      # HOME comes from the invoking shell, not from .env. `:?` rather than a
      # default because every way it can be wrong is silent: unset (a systemd
      # unit, some CI runners) interpolates to empty and mounts /.claude, and
      # `sudo docker compose up` mounts root's. Docker creates a missing bind
      # source rather than refusing, so the symptom would be a dashboard
      # reporting zero usage — which is also what a quiet week looks like.
      #
      # UF_CLAUDE_DIR first, and it exists for Windows. `Requirements` names no
      # operating system and CI covers linux/amd64 and linux/arm64, so the only
      # place the host OS reaches this file is here — and a PowerShell or `cmd`
      # session sets USERPROFILE rather than HOME. Without a way through, a
      # Windows operator following the README meets a refusal telling them not
      # to use sudo, which is advice about a command they did not run and an
      # account their system does not have. Git Bash and WSL set HOME and are
      # unaffected either way.
      #
      # An explicit variable rather than `${HOME:-${USERPROFILE}}`: the fallback
      # form silently mounts the wrong directory when both are set to different
      # things, which is the same quiet-wrong-mount failure the `:?` above was
      # chosen to prevent. This asks the operator to say it once, in .env.
      - ${UF_CLAUDE_DIR:-${HOME:?set UF_CLAUDE_DIR in .env (Windows), or run compose as your own user and not under sudo (macOS, Linux)}}/.claude:/home/node/.claude

      # The code the agent is allowed to touch. Point these at parent
      # directories of the projects you want to work on.
      #
      # Compose cannot leave a volume out conditionally, so slots 2-4 fall back
      # to slot 1's directory. That is harmless: a slot is only offered in the
      # UI when WORKSPACE_ROOTS above lists it, which needs its NAME set in
      # .env. An unnamed slot is mounted but unreachable.
      #
      # Slot 1 has no default. It used to fall back to ~/Documents/GIT, which
      # made the one genuinely required setting optional — and getting it wrong
      # produces an empty folder picker, not an error, because Docker creates
      # whatever path it is handed.
      - ${UF_WORKSPACE:?set UF_WORKSPACE in .env to the directory holding your projects — see .env.example}:/workspace
      - ${UF_WORKSPACE_2:-${UF_WORKSPACE}}:/workspace2
      - ${UF_WORKSPACE_3:-${UF_WORKSPACE}}:/workspace3
      - ${UF_WORKSPACE_4:-${UF_WORKSPACE}}:/workspace4

      # SQLite database (runs, events, settings). A named volume rather than a
      # bind mount, so `docker compose -p <project>` namespaces it and two
      # instances do not share one database — but it also means its root
      # ownership and mode are copied from /data *in the image* when Docker
      # first creates it, not taken from the host. The image ships that
      # directory root-owned 0700, which is the whole of what keeps an agent out
      # of the database, the settings the guards read and the server lock. A
      # volume created by an earlier release is `node:node 0777` and stays that
      # way through any number of image pulls, so `docker-entrypoint.sh`
      # reclaims it on every boot.
      - usagefoundry-data:/data

      # Go's module and build cache (GOPATH and GOCACHE, both pointed here by
      # the image). A named volume because the alternative is not "a slower
      # first build" but the same download on every container: the default
      # location is inside the writable layer, which `docker compose up --build`
      # discards, so every agent working on a Go repository would re-fetch every
      # dependency of every module after each upgrade — minutes of a billed work
      # cycle, spent again each time.
      #
      # Not a bind mount, and not inside /data. A bind mount would put container
      # uids on a host directory for a cache the operator never reads, and /data
      # is root-owned 0700 precisely to keep the agents out — while this is the
      # one directory they must be able to write. `down -v` destroys it, which is
      # the correct treatment of a cache and the reason backups are not here.
      - usagefoundry-gocache:/home/node/go

      # Where `gh` keeps its extensions, and a named volume for the same reason
      # the Go cache above is one: the default location is inside the writable
      # layer, which `docker compose up --build` discards. An extension
      # installed by hand in a shell therefore works until the next upgrade and
      # is then simply gone — and what an agent sees at that point is
      # `unknown command`, inside a tool call nothing here reads, which the run
      # loop files as the agent choosing not to use it.
      #
      # It holds executables that run as UF_AGENT_UID with the run's own
      # GH_TOKEN in their environment, so treat the list in UF_GH_EXTENSIONS the
      # way you would treat a dependency: `owner/repo@tag` pins one, and
      # `docker compose down -v` is what discards them.
      - usagefoundry-gh:/home/node/.local/share/gh

      # Where the tools UF_PY_TOOLS names live — uv's tool directory, its
      # launcher directory and any interpreter it had to fetch, under one root
      # so one mount covers all three. A named volume for the reason the two
      # above are: the default location is the writable layer, which
      # `docker compose up --build` discards.
      #
      # What that costs here is quieter than gh's `unknown command`. These are
      # invoked by a plugin's hooks, and a hook body ends in `|| true` — so a
      # missing command is not an error the run loop can read, it is a hook that
      # exits 0 having done nothing, on every session start.
      - usagefoundry-pytools:/home/node/pytools

      # winnow's intake filter ledger and its off switch, when WINNOW_FILTER is
      # on. A named volume for the reason the three above are — the default
      # location is the writable layer — but with a loss that is not a cache's:
      # the ledger is the record of which bytes a transcript still holds and the
      # API never received, so a discarded one is not a slower next boot, it is
      # a correction that can never be made again. That is measured: a restart
      # while it lived in the writable layer took 52 lines with it.
      #
      # Not inside /data, where it was until the filter stopped running as root.
      # /data is root-owned 0700 to keep the agents out of the database and the
      # guards' settings, and the filter now runs at UF_AGENT_UID — so it is a
      # volume of its own, root-owned 0755, with `docker-entrypoint.sh` handing
      # the one file the filter writes to that uid by name.
      - usagefoundry-winnow:/var/lib/winnow

      # Where `scripts/backup-db.mjs` writes, and the one thing here that is
      # deliberately *not* the named volume above: a snapshot kept inside the
      # volume dies with `docker compose down -v`, which is the command this
      # whole path exists to survive. A bind mount, so the backups land in a
      # directory on the host that whatever backs up your home directory can
      # see. Nothing writes here unless you run the script — see
      # docs/backup-and-restore.md.
      #
      # The repository ships an empty ./backups so the default works with no
      # setup. Point UF_BACKUP_DIR somewhere else and the directory has to exist
      # first: Docker creates a missing bind source as root, and the children
      # that write it run as UF_AGENT_UID.
      - ${UF_BACKUP_DIR:-./backups}:/backups

    # ------------------------------------------------------------------------
    # What this container may ask the kernel for — commented out, and the whole
    # of what UF_SANDBOX above needs from the host.
    # ------------------------------------------------------------------------
    # Uncomment the two lines below to let bubblewrap start — or, better, put
    # them in a docker-compose.override.yml, which compose merges automatically
    # and which is one host's answer rather than this project's. They stay
    # commented here so that a stock `docker compose up` cannot fail on a
    # profile file a daemon rejects, for a sandbox nobody asked for. Nothing
    # else here depends on them: with them commented the image still carries
    # bwrap, socat and the seccomp applier, and every one of them sits unused,
    # which is what makes a stock install identical to the one before this
    # section existed. A missing ./uf-seccomp.json cannot break a boot that
    # never reads it.
    #
    # **They are necessary and they are not sufficient, and that is measured.**
    # With the profile applied, `bwrap --dev-bind / / --unshare-user` exits 0 at
    # both uids on Docker Engine 29.7.2 / kernel 6.12.76-linuxkit, where without
    # it the same command fails "No permissions to create new namespace". What
    # still fails afterwards is a fresh procfs: Docker masks parts of `/proc`,
    # so `--proc /proc` — the CLI's *default* bubblewrap shape — dies with
    # "Can't mount proc on /newroot/proc: Operation not permitted", as root as
    # well. docker-entrypoint.sh therefore writes `enableWeakerNestedSandbox`
    # into the managed policy, which is what switches the CLI to the shape that
    # works. Turning this on without that key gets a sandbox that still cannot
    # start — and, since the CLI's availability check only asks whether bwrap
    # exists, one that fails inside every Bash call instead of at startup.
    #
    # What it widens. Docker's default seccomp profile allows the whole
    # namespace-and-mount family only to a container holding CAP_SYS_ADMIN, and
    # this one holds none — so `unshare` fails with EPERM before the kernel is
    # consulted at all. Measured in the shipped container rather than reasoned
    # about: plain `unshare -U`, which needs no privilege on a stock kernel,
    # fails the same way; `/proc/sys/user/max_user_namespaces` is 31734 and
    # `Seccomp: 2` with one filter loaded — and one filter is still loaded with
    # this profile applied, since it is a narrowed Docker default and not
    # `seccomp=unconfined`. ./uf-seccomp.json is Docker's own
    # default profile with six syscalls ungated — clone, clone3, unshare, mount,
    # umount2, pivot_root — which is the user namespace and the mount namespace
    # bubblewrap builds inside it, and nothing else. The twenty-one other
    # syscalls in the rule this reaches into (bpf, perf_event_open, setns,
    # syslog, quotactl, sethostname and the rest) stay behind the capability
    # gate Docker put them behind. The kernel still applies its own
    # user-namespace rules afterwards; what changes is that it is asked.
    #
    # What it does not widen. No CAP_SYS_ADMIN — the capability set is
    # untouched, and it is the capability rather than the syscall that carries
    # the mount-anywhere powers people mean by "SYS_ADMIN". Not `--privileged`,
    # which is every capability, every device and no seccomp filter at all. And
    # nothing like mounting the Docker socket, which is root on the host wearing
    # a unix socket. It is materially smaller than the first and not comparable
    # to the other two.
    #
    # ./uf-seccomp.json is generated, not written by hand — regenerate it
    # against your own engine's version so every rule this does not touch stays
    # the one Docker actually ships:
    #
    #   python3 scripts/make-seccomp-profile.py "v$(docker version --format '{{.Server.Version}}')"
    #
    # The shipped file is moby v28.5.2's default with the six names appended.
    # That command only works for a version moby tags: an engine on 29.x gets a
    # 404, because moby publishes no v29 tag, and the profile has to stay the
    # newest tagged default until it does. Applied under Engine 29.7.2 it is
    # accepted and the container still runs filtered.
    #
    # security_opt:
    #   - seccomp=./uf-seccomp.json

    # ------------------------------------------------------------------------
    # What this container may take from the host before Docker stops it.
    # ------------------------------------------------------------------------
    # Without these the container's ceiling is "whatever the host has", so an
    # over-configured fleet does not fail here — it takes the machine down with
    # it. The kernel's OOM killer picks its victim by badness score across the
    # *whole host*, so the process it kills may be an agent, may be the server
    # that is supposed to be guarding the runs, and may be a database or an
    # sshd that has nothing to do with this app. A limit does not stop the
    # fleet being too large; it makes the failure local and recoverable —
    # Docker kills inside this cgroup, `restart: unless-stopped` below brings
    # the container back, and `reconcileOnBoot` closes out the runs it was
    # carrying with a reason on each.
    #
    # `mem_limit` is sized as `concurrent work cycles × per-cycle budget + other
    # Claude processes × their own + server + headroom`, and the shipped figure
    # is for the shipped settings — `maxConcurrentRuns: 4` and
    # `maxConcurrentAssists: 2`:
    #
    #     4 work cycles × 1.5 GiB                          6.0 GiB
    #     2 other Claude processes × 0.5 GiB               1.0 GiB
    #     server (2 GiB heap ceiling + ~0.5 GiB off-heap)  2.5 GiB
    #     headroom (git, gh, page cache)                   0.5 GiB
    #                                                     ---------
    #                                                     10.0 GiB
    #
    # 1.5 GiB per work cycle is a budget rather than a measurement: `claude
    # --help` on the pinned CLI peaks at 309 MB before it has held a
    # conversation or made a request, and a real cycle also holds the context
    # window, the transcript it is writing and every tool result — then starts
    # builds and test suites of its own inside this same cgroup.
    #
    # **Raise this together with `maxConcurrentRuns` and
    # `maxConcurrentAssists`, never after the fact.** A fleet raised past the
    # limit and no memory limit at all are the same decision made twice;
    # README's "Sizing the container" has the arithmetic and a worked
    # example at 25 runs. Set it *below* the RAM you are willing to give this
    # container — a limit above what the host can supply is not a limit.
    mem_limit: ${UF_MEM_LIMIT:-10g}
    # Equal to mem_limit, which is how Docker spells "no swap". Left unset it
    # defaults to twice mem_limit, so the stated ceiling would quietly be a RAM
    # ceiling with an equal amount of swap behind it — and 10 GiB of swap
    # thrash starves the host just as effectively as the OOM kill this exists
    # to confine, only slower and with no log entry.
    memswap_limit: ${UF_MEM_LIMIT:-10g}
    # Tasks, not processes: a Node process is ~11 threads before it forks
    # anything, and `npm ci` inside an agent's checkout starts one worker per
    # core. The shipped fleet models out at ~400 tasks with every agent
    # building at once, so 2048 is roughly five times the worst ordinary case
    # while still being far below a host's own pid_max. It is deliberately
    # generous: hitting it fails a fork inside an agent's tool call, which is
    # local and legible, where the runaway it exists to stop — a fork bomb in
    # agent-authored code — is neither.
    pids_limit: ${UF_PIDS_LIMIT:-2048}
    # No quota by default, and that default cannot be a number: Docker refuses
    # a `cpus` larger than the host's CPU count, so any figure shipped here
    # would make `docker compose up` fail outright on a smaller machine — a
    # wrong answer to a correct configuration. 0 is Docker's own "no limit".
    #
    # Set UF_CPUS to leave the host a core or two (`nproc` minus one is the
    # usual choice). What it buys is the host staying responsive while 25
    # agents compile, so an operator can still reach this app and stop them; it
    # does not protect the server's event loop from its own children, which
    # share the same quota.
    cpus: ${UF_CPUS:-0}

    # Long enough for the shutdown to account for the work cycles it is killing.
    #
    # On SIGTERM the server interrupts every live run, waits out
    # SHUTDOWN_GRACE_MS (10s — the kill ladder's own SIGINT/SIGTERM/SIGKILL
    # steps end at 8s) and reconciles each interrupted cycle's spend from the
    # transcripts. Docker's default is 10s, which would SIGKILL the process at
    # the exact moment the last agent died and throw away the accounting this
    # exists to recover. Not much longer either: `restart: unless-stopped` means
    # this is also how long a routine restart takes.
    stop_grace_period: 30s

    restart: unless-stopped

volumes:
  usagefoundry-data:
  usagefoundry-gocache:
  usagefoundry-gh:
  usagefoundry-pytools:
  usagefoundry-winnow:
